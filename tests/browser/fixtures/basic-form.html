<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Standard Form</title>
</head>
<body>
  <h1>Apply for Senior Engineer</h1>
  <form id="application-form">
    <div>
      <label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="first_name" required autocomplete="given-name" />
    </div>
    <div>
      <label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="last_name" required autocomplete="family-name" />
    </div>
    <div>
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required autocomplete="email" />
    </div>
    <div>
      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone" name="phone" required autocomplete="tel" />
    </div>
    <div>
      <label for="years_exp">Years of Experience</label>
      <input type="number" id="years_exp" name="total_experience" min="0" max="50" />
    </div>
    <div>
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" autocomplete="bday" />
    </div>
    <div>
      <label for="cover_letter">Cover Letter / Note</label>
      <textarea id="cover_letter" name="cover_letter" rows="4"></textarea>
    </div>
    <div>
      <label for="city">Current City</label>
      <input type="text" id="city" name="city" />
    </div>
    <div>
      <label for="portfolio_url">Portfolio Link</label>
      <input type="url" id="portfolio_url" name="portfolio" />
    </div>
  </form>
</body>
</html>
