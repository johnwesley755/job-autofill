<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoho Recruit Candidate Form</title>
</head>
<body>
  <form name="recruit_form" data-zcqa="apply_job_form">
    <div class="zr-field-row">
      <label class="field-label">First Name <span class="required">*</span></label>
      <input type="text" name="CANDIDATE_FIRST_NAME" value="" />
    </div>
    <div class="zr-field-row">
      <label class="field-label">Last Name <span class="required">*</span></label>
      <input type="text" name="CANDIDATE_LAST_NAME" value="" />
    </div>
    <div class="zr-field-row">
      <label class="field-label">Email <span class="required">*</span></label>
      <input type="email" name="CANDIDATE_EMAIL" value="" />
    </div>
    <div class="zr-field-row">
      <label class="field-label">Phone <span class="required">*</span></label>
      <input type="tel" name="CANDIDATE_PHONE" value="" />
    </div>
    <div class="zr-field-row">
      <label class="field-label">LinkedIn Profile</label>
      <input type="text" name="CANDIDATE_LINKEDIN" value="" />
    </div>
  </form>
</body>
</html>
