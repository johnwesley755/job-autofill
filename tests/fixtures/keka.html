<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keka HR Job Application</title>
</head>
<body>
  <div class="keka-apply-container">
    <div class="form-group">
      <label class="control-label">Full Name <span class="text-danger">*</span></label>
      <input type="text" name="fullName" value="" />
    </div>
    <div class="form-group">
      <label class="control-label">Email Address <span class="text-danger">*</span></label>
      <input type="email" name="emailAddress" value="" />
    </div>
    <div class="form-group">
      <label class="control-label">Mobile Number <span class="text-danger">*</span></label>
      <input type="tel" name="mobileNumber" value="" />
    </div>
    <div class="form-group">
      <label class="control-label">Notice Period</label>
      <select name="noticePeriod">
        <option value="">Select notice period</option>
        <option value="Immediate">Immediate</option>
        <option value="15 days">15 days</option>
        <option value="30 days">30 days</option>
      </select>
    </div>
  </div>
</body>
</html>
