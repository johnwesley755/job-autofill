<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoho Forms Job Application</title>
</head>
<body>
  <form action="formPerma" method="POST" class="zf-templateWidth">
    <ul>
      <li class="zf-tempFrmWrapper">
        <label class="zf-labelName">First Name <em class="zf-important">*</em></label>
        <input type="text" name="Name_First" value="" placeholder="First Name" />
      </li>
      <li class="zf-tempFrmWrapper">
        <label class="zf-labelName">Last Name <em class="zf-important">*</em></label>
        <input type="text" name="Name_Last" value="" placeholder="Last Name" />
      </li>
      <li class="zf-tempFrmWrapper">
        <label class="zf-labelName">Email <em class="zf-important">*</em></label>
        <input type="email" name="Email" value="" placeholder="user@example.com" />
      </li>
      <li class="zf-tempFrmWrapper">
        <label class="zf-labelName">Phone Number <em class="zf-important">*</em></label>
        <input type="tel" name="PhoneNumber" value="" placeholder="Phone" />
      </li>
      <li class="zf-tempFrmWrapper">
        <label class="zf-labelName">Years of Experience</label>
        <select name="Experience">
          <option value="">-Select-</option>
          <option value="0-1">0-1 years</option>
          <option value="1-3">1-3 years</option>
          <option value="3-5">3-5 years</option>
          <option value="5+">5+ years</option>
        </select>
      </li>
    </ul>
  </form>
</body>
</html>
