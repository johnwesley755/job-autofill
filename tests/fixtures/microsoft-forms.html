<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microsoft Forms Application</title>
</head>
<body>
  <div data-automation-id="form-page">
    <div data-automation-id="questionItem">
      <span data-automation-id="questionTitle">First Name *</span>
      <input type="text" name="r101" placeholder="Enter your first name" />
    </div>

    <div data-automation-id="questionItem">
      <span data-automation-id="questionTitle">Last Name *</span>
      <input type="text" name="r102" placeholder="Enter your last name" />
    </div>

    <div data-automation-id="questionItem">
      <span data-automation-id="questionTitle">Email *</span>
      <input type="text" name="r103" placeholder="Enter your email" />
    </div>

    <div data-automation-id="questionItem">
      <span data-automation-id="questionTitle">Are you legally authorized to work? *</span>
      <div role="radiogroup">
        <label><input type="radio" name="auth_radio" value="Yes" /> Yes</label>
        <label><input type="radio" name="auth_radio" value="No" /> No</label>
      </div>
    </div>
  </div>
</body>
</html>
