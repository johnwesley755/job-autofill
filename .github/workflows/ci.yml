name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run check

    - name: Run unit & integration tests
      run: npm run test

    - name: Build extension bundle
      run: npm run build

    - name: Validate extension manifest and bundle
      run: npm run validate:extension

  browser-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium with dependencies
      run: npx playwright install --with-deps chromium

    - name: Build extension bundle
      run: npm run build

    - name: Run Chromium browser tests
      run: npm run test:browser

    - name: Run Extension Chromium E2E tests
      run: npm run test:extension
